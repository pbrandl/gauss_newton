[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gauss-newton"
version = "0.1.0"
description = "Gauss-Newton least-squares optimizer with finite-difference Jacobians, built on NumPy."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "pbrandl" }]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
examples = ["matplotlib>=3.5"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Repository = "https://github.com/pbrandl/gauss_newton"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gauss_newton = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "SIM", "NPY", "RUF"]

[tool.mypy]
files = ["src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
